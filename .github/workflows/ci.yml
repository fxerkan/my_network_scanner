name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # nmap is optional at runtime; installing it lets the tests that touch it run.
      - name: Install nmap
        run: sudo apt-get update && sudo apt-get install -y nmap

      - name: Install package
        run: pip install -e ".[all,dev]"

      - name: Lint (non-blocking)
        run: ruff check mynes/ || true

      - name: Test
        run: pytest tests/ -q
