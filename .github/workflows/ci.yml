name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # nmap: optional at runtime, but installed so the tests that touch it run.
      # xvfb: the tray tests import pystray, whose Xlib backend needs a display.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y nmap xvfb

      - name: Install package
        run: pip install -e ".[all,dev]"

      - name: Deploy manifests match the version
        run: python3 scripts/sync_version.py --check

      - name: Lint (non-blocking)
        run: ruff check mynes/ || true

      - name: Test
        run: xvfb-run -a pytest tests/ -q
