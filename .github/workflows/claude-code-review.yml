name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # write, not read: the action posts its review as a PR comment.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # Expires roughly yearly. Refresh with `claude setup-token`, then
          # `gh secret set CLAUDE_CODE_OAUTH_TOKEN`. Swap in anthropic_api_key
          # if you would rather bill the API than the subscription.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            Review this pull request. MyNeS is a Flask app that scans a home
            LAN, so weigh these above generic style notes:

            - Discovery backends are optional by contract. A missing bleak or
              an unreachable MQTT broker must degrade one feature, never break
              a scan - DiscoveryBackend.available() returns (False, why)
              instead of raising.
            - A permission failure must never return an empty device list
              silently. That shipped once as "2 devices found where 29 exist".
            - No secrets in config/config.json; it is tracked in git.
            - Page CSS consumes design-system.css tokens, never literal
              colours, and icons come from the sprite rather than emoji.
            - UI strings go through _() with entries in web/locales/{tr,en}.
            - Non-trivial modules carry a runnable demo() with asserts.

            Flag real defects with the file and line. Skip the praise.
          claude_args: |
            --allowedTools "Bash(python -m pytest tests/ -q),Bash(git diff:*),Bash(git log:*)"
