services:
  mynes:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: fxerkan/my_network_scanner:latest
    container_name: mynes
    # host networking is what makes ARP/mDNS/SSDP discovery actually see the LAN.
    # On Docker Desktop (macOS/Windows) host mode is limited - comment it out and
    # uncomment the `ports:` block below, accepting reduced discovery.
    network_mode: host
    # ports:
    #   - "5883:5883"
    volumes:
      - ../data:/app/data
      - ../config:/app/config
      # Optional. Names the containers and the docker networks behind the br-*
      # bridges; without it every bridge is an indistinguishable "<host>
      # (Docker)" device and the Docker panel reads "not installed".
      # Not :ro - connecting to a unix socket needs write permission on it, and
      # :ro would only break the mount without restricting the API anyway.
      # Drop this line if you would rather not expose the Docker API.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      MYNES_PORT: 5883
      # Set in a .env file next to this compose file. Leave unset to auto-generate.
      MYNES_PASSWORD: ${MYNES_PASSWORD:-}
      # Optional Home Assistant / MQTT wiring
      MYNES_MQTT_HOST: ${MYNES_MQTT_HOST:-}
      MYNES_MQTT_USERNAME: ${MYNES_MQTT_USERNAME:-}
      MYNES_MQTT_PASSWORD: ${MYNES_MQTT_PASSWORD:-}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5883/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
