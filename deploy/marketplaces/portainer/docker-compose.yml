# Stack file for the Portainer App Template (type 3). No `build:` here on purpose -
# Portainer must pull the published image, not try to build it.
services:
  mynes:
    image: fxerkan/my_network_scanner:1.7.0
    container_name: mynes
    # Host networking is what makes ARP/mDNS/SSDP discovery see the LAN at all.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    environment:
      MYNES_PORT: ${MYNES_PORT:-5883}
      TZ: ${TZ:-UTC}
      MYNES_PASSWORD: ${MYNES_PASSWORD:-}
      MYNES_MQTT_HOST: ${MYNES_MQTT_HOST:-}
      MYNES_MQTT_USERNAME: ${MYNES_MQTT_USERNAME:-}
      MYNES_MQTT_PASSWORD: ${MYNES_MQTT_PASSWORD:-}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
    volumes:
      - mynes-data:/app/data
      - mynes-config:/app/config
      # Optional: names your containers and the docker networks behind the
      # br-* bridges. Remove it to keep the Docker API out of MyNeS.
      - /var/run/docker.sock:/var/run/docker.sock
      # Bluetooth LE discovery: bleak reaches the host's BlueZ over the D-Bus
      # system bus, so no USB passthrough and no privileged mode - the app still
      # runs unprivileged. Harmless if the host has no bluetoothd: MyNeS reports
      # the bus as unreachable instead of failing. Remove to disable BLE.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client as h; c=h.HTTPConnection('localhost',5883,timeout=5); c.request('GET','/api/health'); exit(0 if c.getresponse().status < 500 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mynes-data:
  mynes-config:
