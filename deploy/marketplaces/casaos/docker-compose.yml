# CasaOS / ZimaOS App Store entry.
# Store path: Apps/MyNeS/docker-compose.yml  (+ icon.svg, thumbnail.png, screenshot-*.png)
name: mynes
services:
  mynes:
    image: fxerkan/my_network_scanner:1.5.0
    container_name: mynes
    # ARP / mDNS / SSDP discovery only sees the LAN from the host network namespace.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    environment:
      MYNES_PORT: "5883"
      TZ: $TZ
      MYNES_PASSWORD: ""
      # Login gate. Fill both in to require a sign-in before MyNeS shows your
      # device list; leave them empty and set them from Settings instead.
      # MYNES_AUTH_PASSWORD accepts a plaintext value or a PBKDF2 hash from
      # `python -m mynes.web.auth --hash` - prefer the hash.
      MYNES_AUTH_USERNAME: ""
      MYNES_AUTH_PASSWORD: ""
      MYNES_MQTT_HOST: ""
      HA_URL: ""
      HA_TOKEN: ""
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /app/data
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /app/config
      # Names your containers and the docker networks behind the br-* bridges.
      # Remove this if you would rather not expose the Docker API to MyNeS -
      # everything else keeps working, the Docker panel just stays empty.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      # Bluetooth LE discovery. bleak reaches the host's BlueZ over the D-Bus
      # system bus, so this needs no USB passthrough and no privileged: true,
      # and the app still runs as the unprivileged `scanner` user. Harmless on a
      # host with no bluetoothd - MyNeS reports the bus as unreachable on the
      # Discovery page instead of failing the scan.
      - type: bind
        source: /run/dbus/system_bus_socket
        target: /run/dbus/system_bus_socket
    deploy:
      resources:
        reservations:
          memory: "256M"
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client as h; c=h.HTTPConnection('localhost',5883,timeout=5); c.request('GET','/api/health'); exit(0 if c.getresponse().status < 500 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    x-casaos:
      envs:
        - container: MYNES_PORT
          description:
            en_US: Web UI port.
            tr_TR: Web arayüzü portu.
        - container: TZ
          description:
            en_US: TimeZone
            tr_TR: Saat dilimi
        - container: MYNES_PASSWORD
          description:
            en_US: Master password used to encrypt stored device credentials. Leave empty to auto-generate.
            tr_TR: Cihaz kimlik bilgilerini şifrelemek için kullanılan ana parola. Boş bırakılırsa otomatik üretilir.
        - container: MYNES_AUTH_USERNAME
          description:
            en_US: Optional. Username for the login gate. Set this and the password to require a sign-in before MyNeS shows your device list.
            tr_TR: İsteğe bağlı. Giriş ekranı kullanıcı adı. Bunu ve parolayı doldurursanız MyNeS cihaz listesini göstermeden önce giriş ister.
        - container: MYNES_AUTH_PASSWORD
          description:
            en_US: Optional. Password for the login gate. A PBKDF2 hash from `python -m mynes.web.auth --hash` is accepted and preferred over a plaintext value.
            tr_TR: İsteğe bağlı. Giriş ekranı parolası. `python -m mynes.web.auth --hash` ile üretilen PBKDF2 özeti kabul edilir ve düz metne tercih edilir.
        - container: MYNES_MQTT_HOST
          description:
            en_US: Optional. MQTT broker host, so Zigbee2MQTT / Z-Wave JS / Tasmota devices show up too.
            tr_TR: İsteğe bağlı. Zigbee2MQTT / Z-Wave JS / Tasmota cihazlarının da görünmesi için MQTT broker adresi.
        - container: HA_URL
          description:
            en_US: Optional. Home Assistant base URL, e.g. http://homeassistant.local:8123
            tr_TR: İsteğe bağlı. Home Assistant adresi, örn. http://homeassistant.local:8123
        - container: HA_TOKEN
          description:
            en_US: Optional. Home Assistant long-lived access token.
            tr_TR: İsteğe bağlı. Home Assistant uzun ömürlü erişim jetonu.
      ports:
        - container: "5883"
          description:
            en_US: Web UI port
            tr_TR: Web arayüzü portu
      volumes:
        - container: /app/data
          description:
            en_US: Device inventory, scan history and alerts.
            tr_TR: Cihaz envanteri, tarama geçmişi ve uyarılar.
        - container: /app/config
          description:
            en_US: Configuration and encrypted credentials.
            tr_TR: Yapılandırma ve şifrelenmiş kimlik bilgileri.
        - container: /var/run/docker.sock
          description:
            en_US: Optional. Lets MyNeS name your containers and the docker networks behind the br-* bridges. Remove it to keep the Docker API out of MyNeS.
            tr_TR: İsteğe bağlı. MyNeS'in container'larınızı ve br-* köprülerinin arkasındaki docker ağlarını isimlendirmesini sağlar. Docker API'sini MyNeS'ten uzak tutmak için kaldırabilirsiniz.
        - container: /run/dbus/system_bus_socket
          description:
            en_US: Optional. Enables Bluetooth LE discovery through the host's BlueZ - trackers, sensors, watches and BLE smart-home gear have no IP and cannot be found any other way. Remove it to disable BLE.
            tr_TR: İsteğe bağlı. Ana makinenin BlueZ servisi üzerinden Bluetooth LE keşfini etkinleştirir - takip cihazları, sensörler, saatler ve BLE akıllı ev cihazlarının IP adresi yoktur ve başka türlü bulunamaz. BLE'yi devre dışı bırakmak için kaldırabilirsiniz.
x-casaos:
  id: io.github.fxerkan.mynes
  version: "1.5.0"
  update_at: "2026-08-04"
  release_notes:
    en_US: |-
      Container fixes, all of them found on a real store install:
      - Raw ARP now works without running as root, so a container install finds
        the devices a ping sweep misses.
      - Docker integration actually connects: containers are named, and each
        docker bridge is labelled with its network instead of a dozen identical
        "<host> (Docker)" entries.
      - Sign-in can be turned on from Settings - no .env file to edit.
      - Web push says what is actually wrong (a plain http:// page cannot
        receive it) and MYNES_TLS=adhoc gives you an https:// page that can.
      - The background-service Install button no longer crashes in a container,
        where scheduled scanning already runs in-process.
    tr_TR: |-
      Gercek bir magaza kurulumunda bulunan container duzeltmeleri:
      - Ham ARP artik root olmadan calisiyor; container kurulumu ping
        taramasinin kacirdigi cihazlari da buluyor.
      - Docker entegrasyonu gercekten baglaniyor: container'lar isimleriyle
        gorunuyor, her docker koprusu bir dusune ait ag adiyla etiketleniyor -
        birbirinin ayni "<host> (Docker)" satirlari yerine.
      - Girise zorunlu kilma Ayarlar'dan acilabiliyor; .env duzenlemek gerekmiyor.
      - Web push neyin yanlis oldugunu soyluyor (duz http:// sayfasi push
        alamaz) ve MYNES_TLS=adhoc alabilen bir https:// sayfasi veriyor.
      - Arka plan servisi Install dugmesi container icinde artik cokmuyor;
        zamanlanmis tarama zaten surec icinde calisiyor.
  architectures:
    - amd64
    - arm64
  main: mynes
  author: fxerkan
  developer: fxerkan
  category: Network
  store_app_id: mynes
  title:
    en_US: My Network Scanner (MyNeS)
    tr_TR: MyNeS - Ağ Tarayıcım
  tagline:
    en_US: See every device on your home network - including the ones an IP scan cannot find.
    tr_TR: Ev ağındaki her cihazı görün - IP taramasının bulamadıklarını da.
  description:
    en_US: >-
      MyNeS discovers, identifies and monitors every device on your home network. Beyond ARP and
      port scanning it speaks mDNS/Bonjour, SSDP/UPnP, Matter, Bluetooth LE and MQTT, so it also
      finds the radio devices an IP scan is blind to: Zigbee bulbs behind Zigbee2MQTT, Z-Wave
      sensors behind Z-Wave JS, BLE trackers and Tasmota nodes.

      A device inventory with vendor lookup over a 1000+ entry OUI database, automatic device-type
      classification, network topology and graph views, scan history, and rule-based monitoring that
      alerts you when a device appears, disappears or changes. Alerts reach you by Web Push,
      webhook, e-mail or straight into Home Assistant.

      Two-way Home Assistant integration: MQTT Discovery pushes every device in as an entity, and the
      REST/WebSocket pull compares what Home Assistant knows against what the network actually shows.

      No cloud, no account, no telemetry. Everything stays on your LAN. Turkish and English UI, light
      and dark themes, and a mobile-friendly PWA.
    tr_TR: >-
      MyNeS ev ağınızdaki her cihazı keşfeder, tanımlar ve izler. ARP ve port taramasının ötesinde
      mDNS/Bonjour, SSDP/UPnP, Matter, Bluetooth LE ve MQTT konuşur; böylece IP taramasının göremediği
      telsiz cihazları da bulur: Zigbee2MQTT arkasındaki Zigbee ampuller, Z-Wave JS arkasındaki
      Z-Wave sensörler, BLE takipçiler ve Tasmota düğümleri.

      1000+ kayıtlık OUI veritabanıyla üretici tespiti, otomatik cihaz tipi sınıflandırma, ağ
      topolojisi ve graf görünümleri, tarama geçmişi ve bir cihaz geldiğinde, gittiğinde ya da
      değiştiğinde haber veren kural tabanlı izleme. Uyarılar Web Push, webhook, e-posta ya da
      doğrudan Home Assistant üzerinden ulaşır.

      Çift yönlü Home Assistant entegrasyonu: MQTT Discovery her cihazı varlık olarak aktarır,
      REST/WebSocket tarafı ise Home Assistant'ın bildiğiyle ağda gerçekte görüneni karşılaştırır.

      Bulut yok, hesap yok, telemetri yok. Her şey yerel ağınızda kalır. Türkçe ve İngilizce arayüz,
      açık ve koyu tema, mobil uyumlu PWA.
  tips:
    before_install:
      en_US: >-
        MyNeS runs on the host network and needs NET_ADMIN/NET_RAW to send raw ARP frames. Without
        them it falls back to a ping sweep plus the OS ARP cache and will find fewer devices.
        Open http://<your-server-ip>:5883 after install. Only scan networks you own.
      tr_TR: >-
        MyNeS host ağında çalışır ve ham ARP paketleri gönderebilmek için NET_ADMIN/NET_RAW ister.
        Bunlar olmadan ping taraması + işletim sistemi ARP önbelleğine düşer ve daha az cihaz bulur.
        Kurulumdan sonra http://<sunucu-ip>:5883 adresini açın. Yalnızca size ait ağları tarayın.
  icon: https://raw.githubusercontent.com/fxerkan/my_network_scanner/main/assets/logo.svg
  thumbnail: https://raw.githubusercontent.com/fxerkan/my_network_scanner/main/assets/store/1.jpg
  screenshot_link:
    - https://raw.githubusercontent.com/fxerkan/my_network_scanner/main/assets/screenshots/home-view.png
    - https://raw.githubusercontent.com/fxerkan/my_network_scanner/main/assets/screenshots/discovery.png
    - https://raw.githubusercontent.com/fxerkan/my_network_scanner/main/assets/screenshots/graph-view.png
    - https://raw.githubusercontent.com/fxerkan/my_network_scanner/main/assets/screenshots/topology-view.png
    - https://raw.githubusercontent.com/fxerkan/my_network_scanner/main/assets/screenshots/monitoring-alerts.png
  index: /
  port_map: "5883"
  scheme: http
  project_url: https://github.com/fxerkan/my_network_scanner
  hostname: ""
